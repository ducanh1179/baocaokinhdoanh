<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trạm điều hành miền</title>
<style>
  :root{
    --bg-deep:#0A1712; --panel:#15301F; --panel-2:#1B3A25; --line:#2B4A36;
    --text:#F2F5F1; --muted:#9FB3A6; --muted-2:#77897E;
    --c-green:#22C55E; --c-green-dark:#15803D;
    --c-gold:#F5A623; --c-gold-dark:#B9790E;
    --c-coral:#FF6B5B; --c-coral-dark:#C93F31;
    --f:'Times New Roman', Times, serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, #143523 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #0F2A1B 0%, transparent 55%),
      var(--bg-deep);
    color:var(--text); font-family:var(--f); min-height:100vh; padding:32px 24px 64px;
  }
  .wrap{max-width:1200px; margin:0 auto;}
  .glossy{position:relative; overflow:hidden;}
  .glossy::after{content:""; position:absolute; top:-60%; left:-20%; width:70%; height:220%;
    background:linear-gradient(115deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.02) 35%, transparent 60%);
    transform:rotate(8deg); pointer-events:none;}

  .tabnav{display:flex; gap:5px; margin-bottom:20px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:5px; flex-wrap:wrap;}
  .tab-btn{font-family:var(--f); font-weight:700; font-size:13px; padding:9px 16px; border-radius:8px; border:none;
    cursor:pointer; background:transparent; color:var(--muted); transition:all .15s ease; white-space:nowrap;}
  .tab-btn.active{background:linear-gradient(135deg, var(--c-gold) 0%, var(--c-gold-dark) 100%); color:#1B1204;
    box-shadow:0 4px 14px rgba(245,166,35,0.35);}
  .tab-btn .dot{display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:6px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:block; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .hero{background:linear-gradient(160deg, var(--panel) 0%, var(--bg-deep) 130%); border:1px solid var(--line);
    border-radius:18px; padding:36px 40px; display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap;}
  .eyebrow{font-size:11px; letter-spacing:0.14em; color:var(--c-gold); text-transform:uppercase; display:flex;
    align-items:center; gap:8px; margin-bottom:10px; font-weight:700;}
  .pulse-dot{width:7px; height:7px; border-radius:50%; background:var(--c-green); animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(34,197,94,0.55);}70%{box-shadow:0 0 0 8px rgba(34,197,94,0);}100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}}
  h1{font-weight:700; font-size:32px; margin-bottom:6px;}
  h2.topic-title{font-weight:700; font-size:26px;}
  .hero-sub{color:var(--muted); font-size:14px; max-width:480px; line-height:1.5;}
  .hero-meta{display:flex; gap:28px; margin-top:22px;}
  .meta-item .meta-num{font-size:20px; font-weight:700;}
  .meta-item .meta-num.alert{color:var(--c-coral);}
  .meta-item .meta-label{font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.05em; margin-top:2px;}

  .gauge-wrap{display:flex; flex-direction:column; align-items:center; gap:6px; flex-shrink:0;}
  .gauge{width:160px; height:160px; position:relative;}
  .gauge svg{transform:rotate(-90deg);}
  .gauge-track{fill:none; stroke:#22432E; stroke-width:11;}
  .gauge-fill{fill:none; stroke-width:11; stroke-linecap:round; stroke-dasharray:452;}
  .gauge-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .gauge-pct{font-size:30px; font-weight:700;}
  .gauge-caption{font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  .groups{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:20px;}
  @media (max-width:900px){.groups{grid-template-columns:1fr;}}
  .group{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px;}
  .group-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:14px; border-bottom:1px dashed var(--line);}
  .group-title{font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:0.03em;}
  .group-score{font-size:13px; color:var(--muted);}
  .group-score b{color:var(--text); font-size:16px;}
  .cards{display:flex; flex-direction:column; gap:12px;}
  .card{background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:16px 18px; display:flex; gap:14px;
    cursor:pointer; transition:border-color .18s ease, transform .18s ease;}
  .card:hover{border-color:#3F6B4E; transform:translateY(-1px);}
  .icon-badge{width:42px; height:42px; border-radius:11px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 10px rgba(0,0,0,0.25);}
  .icon-badge svg{width:22px; height:22px; stroke:#fff;}
  .icon-badge.green{background:linear-gradient(135deg, var(--c-green) 0%, var(--c-green-dark) 100%);}
  .icon-badge.gold{background:linear-gradient(135deg, var(--c-gold) 0%, var(--c-gold-dark) 100%);}
  .icon-badge.coral{background:linear-gradient(135deg, var(--c-coral) 0%, var(--c-coral-dark) 100%);}
  .card-body{flex:1; min-width:0;}
  .card-top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .card-name{font-weight:700; font-size:17px;}
  .status{display:flex; align-items:center; gap:6px; font-size:12px; padding:4px 9px; border-radius:20px; white-space:nowrap; font-weight:700;}
  .status-dot{width:7px; height:7px; border-radius:50%;}
  .status.ok{background:rgba(34,197,94,0.14); color:var(--c-green);}
  .status.ok .status-dot{background:var(--c-green);}
  .status.watch{background:rgba(245,166,35,0.14); color:var(--c-gold);}
  .status.watch .status-dot{background:var(--c-gold);}
  .status.alert{background:rgba(255,107,91,0.16); color:var(--c-coral);}
  .status.alert .status-dot{background:var(--c-coral); animation:pulse2 1.6s infinite;}
  @keyframes pulse2{0%{box-shadow:0 0 0 0 rgba(255,107,91,0.55);}70%{box-shadow:0 0 0 6px rgba(255,107,91,0);}100%{box-shadow:0 0 0 0 rgba(255,107,91,0);}}
  .card-meta{display:flex; align-items:center; gap:10px; margin-top:8px; font-size:12px; color:var(--muted-2);}
  .cadence{background:#0E2417; border:1px solid var(--line); border-radius:6px; padding:2px 7px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
  .card-hint{margin-top:10px; font-size:11px; color:var(--muted-2); font-style:italic;}

  .bottleneck{margin-top:20px; background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px;}
  .bn-title{font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:0.03em; display:flex; align-items:center; gap:8px;}
  .bn-title::before{content:"▲"; color:var(--c-coral); font-size:11px;}
  .bn-sub{font-size:12px; color:var(--muted-2); margin-top:2px; font-style:italic;}
  .bn-list{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:14px;}
  @media (max-width:900px){.bn-list{grid-template-columns:1fr;}}
  .bn-item{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; border-left:3px solid var(--c-coral);}
  .bn-item .rank{font-size:11px; color:var(--c-coral); font-weight:700;}
  .bn-item .desc{font-size:13.5px; margin-top:6px; line-height:1.4;}
  .bn-item .owner{font-size:11.5px; color:var(--muted-2); margin-top:8px; display:flex; justify-content:space-between; align-items:center;}

  .bn-item-v2{background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:14px 16px; cursor:pointer; transition:border-color 0.15s;}
  .bn-item-v2:hover{border-color:var(--c-gold);}
  .bn-item-v2.sev-high{border-left:4px solid var(--c-coral);}
  .bn-item-v2.sev-med{border-left:4px solid var(--c-gold);}
  .bn-top-row{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .bn-rank{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;}
  .bn-severity{font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px;}
  .bn-severity.high{background:rgba(255,107,91,0.18); color:var(--c-coral);}
  .bn-severity.med{background:rgba(245,166,35,0.18); color:var(--c-gold);}
  .bn-detail-row{display:flex; gap:14px; margin-top:8px; font-size:11.5px; color:var(--muted);}
  .bn-arrow{color:var(--c-gold); font-weight:700; font-size:11.5px;}

  .whatsnew{background:linear-gradient(135deg, rgba(245,166,35,0.10), rgba(245,166,35,0.03)); border:1px solid var(--c-gold); border-radius:14px; padding:16px 20px; margin-bottom:18px;}
  .whatsnew-title{font-weight:700; font-size:14px; color:var(--c-gold); margin-bottom:8px;}
  .whatsnew-list{list-style:none; display:flex; flex-direction:column; gap:6px;}
  .whatsnew-list li{font-size:12.5px; line-height:1.5; color:var(--text); padding-left:2px;}

  .topic-header{background:linear-gradient(160deg, var(--panel) 0%, var(--bg-deep) 130%); border:1px solid var(--line);
    border-radius:18px; padding:28px 32px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:20px;}
  .topic-header-left{display:flex; align-items:center; gap:16px;}
  .topic-icon{width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.25), 0 4px 12px rgba(0,0,0,0.3);}
  .topic-icon svg{width:28px; height:28px; stroke:#fff;}
  .topic-meta-row{display:flex; align-items:center; gap:10px; margin-top:6px;}

  .stat-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:20px;}
  @media (max-width:800px){.stat-row{grid-template-columns:1fr 1fr;}}
  .stat-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px;}
  .stat-card .label{font-size:11px; color:var(--muted-2); text-transform:uppercase; letter-spacing:0.04em; font-weight:700;}
  .stat-card .value{font-size:26px; font-weight:700; margin-top:6px;}
  .stat-card .value.green{color:var(--c-green);} .stat-card .value.gold{color:var(--c-gold);} .stat-card .value.coral{color:var(--c-coral);}
  .stat-card .sub{font-size:11.5px; color:var(--muted-2); margin-top:3px;}

  .topic-section{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:18px;}
  .topic-section-title{font-weight:700; font-size:16px; text-transform:uppercase; letter-spacing:0.03em; margin-bottom:4px;}
  .topic-section-sub{font-size:12px; color:var(--muted-2); margin-bottom:14px; font-style:italic;}

  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{font-size:11px; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted); text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); font-weight:700;}
  td{padding:11px 10px; border-bottom:1px solid rgba(43,74,54,0.5);}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .pill.ok{background:rgba(34,197,94,0.14); color:var(--c-green);}
  .pill.watch{background:rgba(245,166,35,0.14); color:var(--c-gold);}
  .pill.alert{background:rgba(255,107,91,0.16); color:var(--c-coral);}
  .updown{font-weight:700;} .updown.up{color:var(--c-green);} .updown.down{color:var(--c-coral);}

  .action-card{border-left:4px solid var(--c-coral); background:var(--panel-2); border-radius:10px; padding:16px 18px;}
  .action-row{display:flex; gap:20px; flex-wrap:wrap; margin-top:8px; font-size:13px; color:var(--muted-2);}
  .action-row b{color:var(--text);}

  .news-grid2{display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:8px;}
  @media (max-width:700px){.news-grid2{grid-template-columns:1fr;}}
  .news-col-title{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .news-col-title.good{color:var(--c-green);} .news-col-title.bad{color:var(--c-coral);}
  .news-list{list-style:none; display:flex; flex-direction:column; gap:9px;}
  .news-list li{font-size:13.5px; line-height:1.5; padding-left:20px; position:relative;}
  .news-list.good li::before{content:"✓"; position:absolute; left:0; color:var(--c-green); font-weight:700;}
  .news-list.bad li::before{content:"!"; position:absolute; left:3px; color:var(--c-coral); font-weight:700;}

  .placeholder-box{background:var(--panel-2); border:1px dashed var(--line); border-radius:12px; padding:26px; text-align:center; color:var(--muted-2); font-style:italic; font-size:13.5px;}

  .prog-list{display:flex; flex-direction:column; gap:11px;}
  .prog-row{display:flex; align-items:center; gap:12px;}
  .prog-name{width:150px; font-size:12.5px; flex-shrink:0; font-weight:600;}
  .prog-track{flex:1; height:15px; background:var(--panel-2); border-radius:8px; overflow:hidden; position:relative; border:1px solid var(--line);}
  .prog-fill{height:100%; border-radius:8px 0 0 8px; transition:width .3s ease;}
  .prog-fill.ok{background:linear-gradient(90deg, var(--c-green) 0%, #16A34A 100%);}
  .prog-fill.watch{background:linear-gradient(90deg, var(--c-gold) 0%, #D18A00 100%);}
  .prog-fill.alert{background:linear-gradient(90deg, var(--c-coral) 0%, #E14A38 100%);}
  .prog-pct{width:56px; text-align:right; font-family:'Times New Roman', Times, serif; font-weight:700; font-size:12.5px; flex-shrink:0;}
  .prog-group-label{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted-2); margin:14px 0 8px;}
  .prog-group-label:first-child{margin-top:0;}

  .update-strip{display:flex; gap:22px; flex-wrap:wrap; align-items:center; padding:10px 16px; margin-bottom:18px;
    background:var(--panel-2); border:1px solid var(--line); border-radius:10px; font-size:12.5px; color:var(--muted-2);}
  .update-strip b{color:var(--text);}
  .update-strip .dot-sep{color:var(--muted-2);}

  .source-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
  .source-link{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:9px;
    background:var(--panel-2); border:1px solid var(--line); color:var(--c-gold); text-decoration:none;
    font-size:12.5px; font-weight:700;}
  .source-link:hover{border-color:var(--c-gold);}
  .source-link.disabled{color:var(--muted-2); border-style:dashed; cursor:default; pointer-events:none;}

  footer{text-align:center; margin-top:28px; font-size:11.5px; color:var(--muted-2);}

  .sq-row{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  @media(max-width:800px){.sq-row{grid-template-columns:1fr 1fr;}}
  .sq-card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .sq-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted-2);}
  .sq-pct{font-size:27px; font-weight:700; margin:6px 0 4px;}
  .sq-sub{font-size:10.5px; color:var(--muted-2); line-height:1.5;}
  .sq-track{height:7px; background:var(--panel-2); border-radius:5px; overflow:hidden; margin-top:8px;}
  .sq-fill{height:100%; border-radius:5px;}
  .sq-dual{display:flex; align-items:baseline; gap:10px; margin:6px 0 2px;}
  .sq-dual .main{font-size:24px; font-weight:700;}
  .sq-dual .sub-pct{font-size:14px; font-weight:700; color:var(--muted-2);}
  .sq-dual .sub-lbl{font-size:9px; color:var(--muted-2); display:block; text-transform:uppercase;}

  .tab-switch{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .tab-btn{font-family:inherit; font-weight:700; font-size:12px; padding:7px 14px; border-radius:9px; border:1px solid var(--line); background:var(--panel); cursor:pointer; color:var(--muted-2);}
  .tab-btn.active{background:var(--c-gold); color:#1a1a1a; border-color:var(--c-gold);}
  .tab-pane{display:none;}
  .tab-pane.active{display:block;}
  .rank{width:22px; height:22px; border-radius:50%; background:var(--c-coral); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:10px;}
  .rank.green{background:var(--c-green);}
  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:800px){.two-col{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="wrap">

  <div class="tabnav" id="tabnav">
    <button class="tab-btn active" data-tab="tongquan" onclick="showTab('tongquan', this)">📡 Tổng quan</button>
    <button class="tab-btn" data-tab="doanhthu" onclick="showTab('doanhthu', this)"><span class="dot" style="background:var(--c-green);"></span>Doanh thu</button>
    <button class="tab-btn" data-tab="target" onclick="showTab('target', this)"><span class="dot" style="background:var(--c-gold);"></span>Target</button>
    <button class="tab-btn" data-tab="pl" onclick="showTab('pl', this)"><span class="dot" style="background:var(--c-gold);"></span>P&amp;L</button>
  </div>

  <div id="tabs-container">
    <div style="text-align:center; padding:60px; color:var(--muted-2);">⏳ Đang tải nội dung...</div>
  </div>

  <footer>HIỂU ĐÚNG → LÀM ĐÚNG → KIỂM ĐÚNG = KẾT QUẢ ĐÚNG &nbsp;·&nbsp; Trạm điều hành miền &nbsp;·&nbsp; 🕐 <span id="footer-version">Đang tải...</span></footer>
</div>

<script>
const TAB_FILES = {
  tongquan: 'tab-tongquan.html',
  doanhthu: 'tab-doanhthu.html',
  target: 'tab-target.html',
  pl: 'tab-pl.html'
};

async function loadAllTabs(){
  const container = document.getElementById('tabs-container');
  container.innerHTML = '';
  for (const [id, file] of Object.entries(TAB_FILES)){
    try {
      const resp = await fetch(file + '?v=' + Date.now());
      const html = await resp.text();
      const temp = document.createElement('div');
      temp.innerHTML = html;
      // di chuyen cac node (bao gom the script) vao container
      while (temp.firstChild) {
        const node = temp.firstChild;
        container.appendChild(node);
      }
    } catch(e){
      console.error('Loi tai tab', id, e);
    }
  }
  // kich hoat lai script (script chen qua innerHTML khong tu chay)
  container.querySelectorAll('script').forEach(oldScript => {
    const newScript = document.createElement('script');
    newScript.textContent = oldScript.textContent;
    oldScript.parentNode.replaceChild(newScript, oldScript);
  });
  // gan lai trang thai active dung nhu ban dau
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.getElementById('tongquan').classList.add('active');
}

function showTab(id, btn){
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  const panel = document.getElementById(id);
  if (panel) panel.classList.add('active');
  btn.classList.add('active');
  window.scrollTo({top:0, behavior:'smooth'});
}
function jumpTab(id){
  const btn = document.querySelector('.tab-btn[data-tab="'+id+'"]');
  showTab(id, btn);
}

loadAllTabs();
</script>
</body>
</html>
