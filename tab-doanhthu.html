    <div class="panel">
      <div class="panelhead"><div><div class="eyebrow2">CHI TIẾT NHÓM ĐANG XEM</div><h2>${b.icon} ${b.label}</h2><p>${b.n} shop trên tổng ${DATA.stores.length} shop toàn miền</p></div></div>
      <div class="grid3">
        <div class="blockcard"><div class="bh">DOANH THU · ${s.labels[s.prev]}</div><div style="font-size:20px;font-weight:800;margin-top:6px">${fmtRevAuto(prev)}</div></div>
        <div class="blockcard"><div class="bh">DOANH THU · ${s.labels[s.cur]}</div><div style="font-size:20px;font-weight:800;margin-top:6px">${fmtRevAuto(cur)}</div></div>
        <div class="blockcard" style="display:flex;flex-direction:column;justify-content:center;align-items:center">
          <span class="status-badge ${growth >= 0 ? "ok" : "danger"}">${growth >= 0 ? "✓ HIỆU QUẢ" : "⚠ CẢNH BÁO"}</span>
          <div style="margin-top:8px" class="${dcls(growth)}">${arrow(growth)} ${fmt1(Math.abs(growth))}% so cùng kỳ</div>
        </div>
      </div>
      <h2 style="font-size:15px;margin:20px 0 10px">Bottom 10 siêu thị · ${b.label}${STATE.qltp !== "all" ? " · QLTP " + qltpByCode(STATE.qltp).name : ""}${STATE.quan !== "all" ? " · Quận " + STATE.quan : ""}</h2>
      <p class="footnote" style="margin-top:-4px">Cột Bill / Giá trị bill là ước tính phân rã từ tăng trưởng doanh thu thật của từng siêu thị, theo đúng tỉ lệ Bill/Giá trị bill mà QLTP quản lý đang ghi nhận (file chưa có Bill/Giá trị bill kỳ trước ở cấp từng siêu thị).</p>
      ${worst.length ? `<div class="tablewrap"><table>
        <thead><tr><th>#</th><th>Siêu thị</th><th>QLTP phụ trách</th><th>Quận</th><th>Doanh thu</th><th>Tăng trưởng</th><th>Do Bill</th><th>Do Giá trị bill</th><th>Nhận xét điều hành</th></tr></thead>
        <tbody>${worst.map((s2, i) => {
          const growth2 = storeGrowthForPeriod(s2);
          const split = storeDriverSplit(s2);
          return `<tr>
          <td>${i + 1}</td><td><b>${s2.id} · ${s2.name}</b></td><td>${s2.qltp_name}</td><td>${s2.quan || "—"}</td>
          <td>${fmtRevAuto(storeRevForPeriod(s2))}</td><td class="${dcls(growth2)}">${arrow(growth2)} ${growth2 === null ? "mới mở" : fmt1(Math.abs(growth2)) + "%"}</td>
          <td class="${dcls(split.bill)}">${pct(split.bill)}</td>
          <td class="${dcls(split.abv)}">${pct(split.abv)}</td>
          <td><span class="status-badge ${growth2 === null ? "new" : growth2 < 0 ? "danger" : "watch"}">${growth2 === null ? "Mới mở" : growth2 < 0 ? "Cảnh báo" : "Tăng chậm nhất nhóm"}</span></td>
        </tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div class="footnote">Không có siêu thị nào khớp bộ lọc hiện tại (QLTP/Siêu thị) trong nhóm ${b.label}.</div>`}
    </div>`;
  }

  function elDiemNghen() {
    const rows = decisionRowsMien().filter((r) => r.color === "do");
    return `
    <div class="panel" id="sec-diemnghen">
      <div class="panelhead"><div><div class="eyebrow2">⚑ ĐIỂM NGHẼN</div><h2>Điểm nghẽn đang kéo dài ≥ 2 kỳ liên tiếp</h2><p>Tổng hợp các vấn đề Đỏ chưa cải thiện qua nhiều kỳ cập nhật gần nhất — ưu tiên xử lý trước tiên</p></div></div>
      ${rows.length ? rows.map((r) => `<div class="bottleneck-card">
        <div class="bt-h">🚩 ${r.name} — thiếu ${fmtRevAuto(Math.abs(r.gap))} so target, ${r.driverLabel.toLowerCase()}</div>
        <div class="bt-m">Nguyên nhân gốc: ${r.driverLabel} · Nơi phát sinh: ${r.nganh} · Hành động: ${r.action} · Phụ trách: ${r.owner}</div>
      </div>`).join("") : `<div class="footnote">Không có vấn đề Đỏ nào trong phạm vi đang lọc.</div>`}
      <div class="footnote">* Đánh dấu "kéo dài ≥2 kỳ" dựa trên nhóm Đỏ của kỳ hiện tại. Khi có dữ liệu nhiều kỳ liên tiếp hơn, sẽ so sánh trực tiếp lịch sử để xác nhận đúng số kỳ liên tiếp.</div>
    </div>`;
  }

  // ---------- QLTP tab ----------
  function elScenarioPanel(q) {
    if ((q._isStore || q._isGroup) && (q.growth_pct === null || q.growth_pct === undefined)) {
      const isGroup = !!q._isGroup;
      const heading = isGroup
        ? (q._storeCount === 0
          ? "Không có siêu thị nào khớp đúng tổ hợp QLTP + Quận đang lọc"
          : `${q.name} chưa đủ dữ liệu kỳ trước để dựng kịch bản tăng trưởng`)
        : `${q.name} mới mở, chưa đủ dữ liệu kỳ trước để dựng kịch bản tăng trưởng`;
      return `
      <div class="panel dark">
        <div class="panelhead">
          <div><div class="eyebrow2">KỊCH BẢN TĂNG TRƯỞNG ${isGroup ? "THEO QUẬN" : "SIÊU THỊ"}</div><h2>${heading}</h2><p>Cần ít nhất 2 kỳ doanh thu (kỳ trước & kỳ hiện tại) để tính mục tiêu +5% — thử đổi lại bộ lọc QLTP/Quận/Siêu thị.</p></div>
          <span class="pill" style="background:rgba(255,255,255,.15);color:#fff">${isGroup ? "Đang xem" : "Siêu thị đang xem"}: ${q.code} · ${q.name}</span>
        </div>
      </div>`;
    }
    const s = qltpSeries(q);
    const cur = s.rev[s.cur];
    const cungky = cur / (1 + q.growth_pct / 100);
    const target5 = cungky * 1.05;
    const gap = cur - target5;
    const needGrowthPct = ((target5 - cur) / cur) * 100;
    const scopeLabel = q._isStore ? "SIÊU THỊ" : q._isGroup ? "THEO QUẬN" : "KHU VỰC";
    const scopeName = q._isStore ? "siêu thị này" : q._isGroup ? "Nhóm siêu thị đang lọc" : "Mỗi QLTP";
    // Số thật đằng sau mỗi kịch bản %, để dễ hình dung hơn là chỉ nhìn con số %:
    // SL bill (bill/ngày) và đơn giá (giá trị bill, nghìn đồng/bill) hiện tại, cùng con số cần đạt
    // nếu chỉ đổi đúng 1 trong 2 đòn bẩy (đòn bẩy còn lại giữ nguyên) — SL bill × đơn giá = Doanh thu.
    const billCurNow = s.bill[s.cur];
    const gtbCurNow = giaTriBillNghin(cur, billCurNow, s.daysInPeriod);
    const scenarioRatio = cur ? target5 / cur : 1;
    const billIfOnlyBill = billCurNow === null || billCurNow === undefined ? null : billCurNow * scenarioRatio;
    const gtbIfOnlyGtb = gtbCurNow === null || gtbCurNow === undefined ? null : gtbCurNow * scenarioRatio;
    const uuTienGtb = Math.abs(q.bill_growth) < Math.abs(q.abv_growth);
    // Gợi ý cụ thể: cần thêm bao nhiêu khách/ngày (Bill) và Sản lượng Fresh cần tăng thêm bao nhiêu để
    // đạt doanh thu mục tiêu — tính theo đúng tỷ lệ tăng trưởng chung (scenarioRatio) áp cho Fresh
    // (nhất quán với cách đang áp dụng cho Bill/Giá trị bill ở trên), vì Fresh tăng kéo lượt khách tăng
    // theo (đã kiểm chứng bằng dữ liệu thật ở Trung tâm quyết định) nên đây cũng là cách tự nhiên nhất
    // để đạt đúng mức tăng lượt bill cần thiết.
    const billDeltaPerDay = billCurNow === null || billCurNow === undefined || billIfOnlyBill === null ? null : billIfOnlyBill - billCurNow;
    const freshCurNow = s.fresh[s.cur];
    const freshIfProportional = freshCurNow === null || freshCurNow === undefined ? null : freshCurNow * scenarioRatio;
    const freshDeltaKg = freshCurNow === null || freshCurNow === undefined || freshIfProportional === null ? null : freshIfProportional - freshCurNow;
    const freshPerDayCur = freshCurNow === null || freshCurNow === undefined ? null : freshCurNow / s.daysInPeriod;
    const freshPerDayTarget = freshIfProportional === null || freshIfProportional === undefined ? null : freshIfProportional / s.daysInPeriod;
    const freshDeltaPerDay = freshDeltaKg === null ? null : freshDeltaKg / s.daysInPeriod;
    return `
    <div class="panel dark">
      <div class="panelhead">
        <div><div class="eyebrow2">KỊCH BẢN TĂNG TRƯỞNG ${scopeLabel}</div><h2>${scopeName} cần thay đổi Bill và Giá trị bill bao nhiêu để đạt +5%?</h2><p>Mục tiêu neo theo doanh thu cùng kỳ; hệ thống tính ngược phương án phù hợp với hướng tháng hiện tại${q._isStore ? " · Bill/Giá trị bill của siêu thị là ước tính phân rã theo tỉ lệ của QLTP quản lý (file chưa có 2 chỉ số này theo lịch sử ở cấp từng siêu thị)" : ""}</p></div>
        <span class="pill" style="background:rgba(255,255,255,.15);color:#fff">${q._isStore ? "Siêu thị" : q._isGroup ? "Đang xem" : "QLTP"} đang xem: ${q.code} · ${q.name}</span>
      </div>
      <div class="grid4">
        <div class="blockcard" style="border-color:rgba(255,255,255,.2);color:#fff"><div class="small" style="color:#cfe3da">DOANH THU CÙNG KỲ</div><div style="font-size:22px;font-weight:800">${fmtRevAuto(cungky)}</div><div class="small" style="color:#cfe3da">Điểm gốc đặt mục tiêu</div></div>
        <div class="blockcard" style="border-color:rgba(255,255,255,.2);color:#fff"><div class="small" style="color:#cfe3da">MỤC TIÊU +5%</div><div style="font-size:22px;font-weight:800">${fmtRevAuto(target5)}</div><div class="small" style="color:#cfe3da">+${fmtRevAuto(target5 - cungky)} so cùng kỳ</div></div>
        <div class="blockcard" style="border-color:rgba(255,255,255,.2);color:#fff"><div class="small" style="color:#cfe3da">DỰ KIẾN HIỆN TẠI</div><div style="font-size:22px;font-weight:800">${fmtRevAuto(cur)}</div><div class="small ${dcls(q.growth_pct)}">${pct(q.growth_pct)}</div></div>
        <div class="blockcard" style="border-color:rgba(255,255,255,.2);color:#fff"><div class="small" style="color:#cfe3da">KHOẢNG CÁCH MỤC TIÊU</div><div style="font-size:22px;font-weight:800">${gap >= 0 ? "Vượt " + fmtRevAuto(gap) : "Thiếu " + fmtRevAuto(Math.abs(gap))}</div><div class="small" style="color:#cfe3da">${gap >= 0 ? "Đã đạt mục tiêu tăng trưởng" : "Cần tăng thêm " + fmt1(Math.abs(needGrowthPct)) + "%"}</div></div>
      </div>
      <div class="scenario3">
        <div class="scard" style="border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff"><div class="stag">Chỉ tăng Bill</div>
          <div class="seq"><div class="box">${fmt1(Math.abs(needGrowthPct))}%</div><span>×</span><div class="box">0%</div><span>=</span><div class="box">${fmt1(Math.abs(needGrowthPct))}%</div></div>
          <div class="small" style="color:#cfe3da;margin-top:6px">Giữ nguyên giá trị bill hiện tại</div>
          <div class="small" style="color:#cfe3da;margin-top:4px">SL bill cần đạt ≈ <b style="color:#fff">${fmtInts(billIfOnlyBill)}</b> bill/ngày (hiện ${fmtInts(billCurNow)}${billDeltaPerDay === null ? "" : `, tăng thêm ≈ ${billDeltaPerDay >= 0 ? "+" : ""}${fmtInts(billDeltaPerDay)} khách/ngày`}) · đơn giá giữ ≈ ${fmtInts(gtbCurNow)} nghìn/bill</div></div>
        <div class="scard" style="border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.06);color:#fff"><div class="stag">Chỉ tăng giá trị bill</div>
          <div class="seq"><div class="box">0%</div><span>×</span><div class="box">${fmt1(Math.abs(needGrowthPct))}%</div><span>=</span><div class="box">${fmt1(Math.abs(needGrowthPct))}%</div></div>
          <div class="small" style="color:#cfe3da;margin-top:6px">Giữ nguyên lượng bill hiện tại</div>
          <div class="small" style="color:#cfe3da;margin-top:4px">Đơn giá cần đạt ≈ <b style="color:#fff">${fmtInts(gtbIfOnlyGtb)}</b> nghìn/bill (hiện ${fmtInts(gtbCurNow)}) · giữ ≈ ${fmtInts(billCurNow)} bill/ngày</div></div>
        <div class="scard reco" style="color:#0b3d30"><div class="stag" style="color:#8a6100">Đề xuất theo xu hướng</div>
          <div class="seq"><div class="box">${uuTienGtb ? "+0%" : fmt1(Math.abs(needGrowthPct)) + "%"}</div><span>×</span><div class="box">${uuTienGtb ? fmt1(Math.abs(needGrowthPct)) + "%" : "+0%"}</div><span>=</span><div class="box">${fmt1(Math.abs(needGrowthPct))}%</div></div>
          <div class="small" style="margin-top:6px">Ưu tiên ${uuTienGtb ? "Giá trị bill" : "Bill"}</div>
          <div class="small" style="margin-top:4px">${uuTienGtb ? `Đơn giá cần đạt ≈ <b>${fmtInts(gtbIfOnlyGtb)}</b> nghìn/bill (hiện ${fmtInts(gtbCurNow)})` : `SL bill cần đạt ≈ <b>${fmtInts(billIfOnlyBill)}</b> bill/ngày (hiện ${fmtInts(billCurNow)})`}</div></div>
      </div>
      ${freshCurNow === null || freshCurNow === undefined ? "" : `
      <div class="note-box" style="background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:#fff">🥬 <b>Gợi ý cụ thể theo Fresh:</b> ${gap >= 0
        ? `${scopeName} đã đạt mục tiêu — duy trì Sản lượng Fresh ở mức ≈ <b>${fmtInts(freshPerDayCur)} kg/ngày</b> (${fmtTanS(freshCurNow)} tấn/kỳ) để giữ đà lượt khách hiện tại.`
        : `Để đạt mục tiêu +5% theo đúng tỷ lệ tăng trưởng chung, Sản lượng Fresh cần đạt ≈ <b>${fmtTanS(freshIfProportional)} tấn</b> (${fmtInts(freshPerDayTarget)} kg/ngày, hiện ≈ ${fmtInts(freshPerDayCur)} kg/ngày) — <b>tăng thêm ≈ ${fmtInts(freshDeltaKg)} kg</b> (${freshDeltaPerDay >= 0 ? "+" : ""}${fmtInts(freshDeltaPerDay)} kg/ngày) so với hiện tại. Fresh tăng kéo lượt khách ghé shop tăng theo (xem phân tích ở Trung tâm quyết định) nên tăng đúng lượng Fresh này cũng là cách tự nhiên nhất để đạt mức${billDeltaPerDay === null ? "" : ` tăng ≈ ${billDeltaPerDay >= 0 ? "+" : ""}${fmtInts(billDeltaPerDay)} khách/ngày`} ở kịch bản "Chỉ tăng Bill" bên trên.`}</div>`}
      <div class="note-box">Nhận xét tự động: ${Math.abs(q.bill_growth) < Math.abs(q.abv_growth)
        ? `Lượt bill đang tăng ${fmt1(Math.abs(q.bill_growth))}% nhưng giá trị bill ${q.abv_growth >= 0 ? "tăng chậm" : "giảm"} ${fmt1(Math.abs(q.abv_growth))}%. Nên tận dụng lượng khách hiện có để tăng số SKU và giá trị giỏ hàng.`
        : `Giá trị bill đang ổn định nhưng lượt bill ${q.bill_growth >= 0 ? "tăng chậm" : "giảm"} ${fmt1(Math.abs(q.bill_growth))}%. Ưu tiên phục hồi lượt khách trước khi đẩy giỏ hàng.`}</div>
    </div>`;
  }

  function elDecisionQltp(q) {
    const rows = decisionRowsQltp(q.code);
    const nStores = scopedStores(q.code).length;
    const nBelow = rows.filter((r) => r.gap < 0).length;
    const totalGap = rows.reduce((s, r) => s + Math.max(0, -r.gap), 0);
    const heading = nBelow > 0 ? "Siêu thị nào cần xử lý để khu vực đạt mục tiêu +5%?" : "Cả khu vực đã đạt Target — đây là 4 siêu thị có dư địa tăng trưởng thấp nhất";
    return `
    <div class="panel">
      <div class="panelhead">
        <div><div class="eyebrow2">TRUNG TÂM QUYẾT ĐỊNH · QLTP ${q.name}</div><h2>${heading}</h2><p>Xếp ưu tiên theo khoảng doanh thu thiếu và động lực Bill/Giá trị bill · kỳ: ${STATE.period === "month" ? "tháng" : "tuần"}</p></div>
        <div class="decision-total"><div class="n">${fmtRevAuto(totalGap)}</div><div class="l">${nBelow}/${nStores} siêu thị chưa đạt Target</div></div>
      </div>
      ${(() => { const a = freshBillAlignment(); return a.total ? `<div class="footnote" style="background:var(--gray-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px">🥬 Ưu tiên đòn bẩy Fresh và lượt bill trước giá trị giỏ hàng: Fresh tăng kéo khách ghé shop thường xuyên hơn, khách mua Fresh thường mua kèm FMCG → tổng doanh thu tăng theo — dữ liệu thật xác nhận ${a.aligned}/${a.total} QLTP toàn miền có Fresh và lượt bill cùng chiều tháng này.</div>` : ""; })()}
      ${rows.length ? `<div class="tablewrap"><table>
        <thead><tr><th>Ưu tiên</th><th>Siêu thị</th><th>Thiếu/Vượt Target</th><th>Vị trí</th><th>Tăng trưởng</th><th>Quyết định / hành động</th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr>
          <td><div class="prio ${r.gap < 0 ? r.color : "xam"}">${i + 1}</div></td>
          <td><b>${r.name}</b></td>
          <td class="${r.gap < 0 ? "neg" : "pos"}">${r.gap < 0 ? "↓" : "↑"} ${fmtRevAuto(Math.abs(r.gap))}</td>
          <td>${r.vitri}</td>
          <td class="${dcls(r.growth)}">${pct(r.growth)}</td>
          <td>${r.gap < 0 ? "Tăng Fresh để kéo lượt bill · rà soát tình trạng hết hàng/giá" : "Duy trì đà tăng, nhân rộng cách làm"}</td>
        </tr>`).join("")}</tbody>
      </table></div>` : `<div class="footnote">Không có siêu thị nào khớp bộ lọc hiện tại.</div>`}
    </div>`;
  }

  function elStoreTable(q) {
    const allStores = scopedStores(q.code);
    // Vòng 16: sort giảm dần theo doanh thu dự kiến (storeRevForPeriod) — áp dụng cho cả All lẫn từng
    // nhóm vị trí, theo yêu cầu chuẩn hoá thứ tự hiển thị (cao -> thấp) cho mọi bảng siêu thị.
    const stores = allStores.filter((s) => STATE.ro === "all" || s.vitri_key === STATE.ro)
      .sort((a, b) => storeRevForPeriod(b) - storeRevForPeriod(a));
    const total = stores.reduce((s, x) => s + storeRevForPeriod(x), 0);
    const totalBill = stores.reduce((s, x) => s + x.bill / (DATA.meta.ngay_da_co || 15), 0);
    const totalFresh = stores.reduce((s, x) => {
      const ratio = STATE.period === "month" ? 1 : (q.fresh_week && q.fresh_month[2] ? q.fresh_week[3] / q.fresh_month[2] : 0.23);
      return s + x.fresh_sl * ratio;
    }, 0);
    return `
    <div class="panel" id="sec-qltp-shop">
      <div class="panelhead"><div><div class="eyebrow2">HIỆU QUẢ SIÊU THỊ & 4 NHÓM VỊ TRÍ</div><h2>Hiệu quả trong siêu thị · ${q.name}</h2><p>Chọn nhóm vị trí mặt bằng (KingFood / Maxidi / Gần chợ truyền thống / Shop trong Cụm DC) để xem đúng nhóm siêu thị; chọn All để xem toàn khu vực · kỳ: ${STATE.period === "month" ? "tháng" : "tuần"}</p></div><span class="pill">${stores.length} siêu thị</span></div>
      <div class="grid4" style="margin-bottom:14px">
        <div class="blockcard"><div class="small">DOANH THU DỰ KIẾN</div><div style="font-size:20px;font-weight:800">${fmtRevAuto(total)}</div></div>
        <div class="blockcard"><div class="small">LƯỢT BILL</div><div style="font-size:20px;font-weight:800">${fmtInt(totalBill)} bill/ngày</div></div>
        <div class="blockcard"><div class="small">SẢN LƯỢNG FRESH</div><div style="font-size:20px;font-weight:800">${fmtTanS(totalFresh)} tấn</div><div style="font-size:11px;color:var(--muted)">≈ ${fmtInt(totalFresh / (STATE.period === "month" ? DAYS_MONTH : 7))} kg/ngày</div></div>
        <div class="blockcard"><div class="small">GIÁ TRỊ BILL</div><div style="font-size:20px;font-weight:800">${fmtInt(giaTriBillNghin(total, totalBill, STATE.period === "month" ? DAYS_MONTH : 7))} nghìn</div></div>
      </div>
      <div class="rofilters">
        <button class="${STATE.ro === "all" ? "on" : ""}" onclick="App.setRo('all')">All</button>
        ${BASKET_LIST.map((b) => `<button class="${STATE.ro === b.key ? "on" : ""}" onclick="App.setRo('${b.key}')">${b.icon} ${b.label}</button>`).join("")}
      </div>
      ${stores.length ? `<div class="tablewrap"><table>
        <thead><tr><th>Siêu thị</th><th>Vị trí</th><th>DT cùng kỳ</th><th>Target</th><th>Dự kiến</th><th>Tăng trưởng</th><th>%HT Target</th><th>Trạng thái</th><th>Nhận xét</th></tr></thead>
        <tbody>${stores.map((s) => {
          const rev = storeRevForPeriod(s);
          const cungky = storePrevRevForPeriod(s);
          const growth = storeGrowthForPeriod(s);
          const realTarget = storeRealTargetForPeriod(s);
          const p = pctHT(rev, realTarget);
          const st = tierFor(rev, realTarget);
          const pos = basketOf(s.vitri_key);
          return `<tr><td><b>${s.id} · ${s.name}</b><div class="small">Quận: ${s.quan || "—"}</div></td>
          <td>${pos ? pos.icon + " " + pos.label : "—"}</td>
          <td>${fmtRevAuto(cungky)}</td><td>${realTarget ? fmtRevAuto(realTarget) : "—"}</td><td>${fmtRevAuto(rev)}</td>
          <td class="${dcls(growth)}">${growth === null ? "Mới mở" : pct(growth)}</td>
          <td><b>${realTarget ? fmt1(p) + "%" : "—"}</b></td>
          <td><span class="status-badge ${st.cls}">${st.label}</span></td>
          <td>${!realTarget ? "Chưa có kỳ trước" : p >= 100 ? "Duy trì đà tăng" : "Tăng Fresh để kéo lượt bill"}</td></tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div class="footnote">Không có siêu thị nào khớp bộ lọc hiện tại.</div>`}
    </div>`;
  }

  function elFreshStoreTable(q) {
    const allStores = scopedStores(q.code);
    const stores = allStores.filter((s) => STATE.roFresh === "all" || s.vitri_key === STATE.roFresh);
    const fresh4 = STATE.period === "week" ? (DATA.fresh4_week || DATA.fresh4) : DATA.fresh4;
    const avgG = fresh4.reduce((s, f) => s + f.share * f.g, 0);
    // Từ Vòng 11 (Tháng) + Vòng 12 (Tuần): dùng thẳng cơ cấu Fresh THẬT của từng siêu thị (DATA.fresh4_by_store
    // / DATA.fresh4_by_store_week, nguồn sheet raw "DATA NH THÁNG"/"DATA NH TUẦN") thay vì áp tỷ trọng Fresh
    // toàn Miền vào doanh thu Fresh ước tính như trước — không còn là ước tính ở cả 2 kỳ nữa.
    const isWeek = STATE.period === "week";
    const byStoreMap = isWeek ? DATA.fresh4_by_store_week : DATA.fresh4_by_store;
    // hist: Tháng có 3 phần tử [prev-prev,prev,cur] -> cur=idx2,prev=idx1; Tuần có 4 phần tử
    // [W-3,W-2,W-1,cur] -> cur=idx3,prev=idx2.
    const curIdx = isWeek ? 3 : 2, prevIdx = isWeek ? 2 : 1;
    // Vòng 16: tính trước "Fresh dự kiến" từng siêu thị rồi sort giảm dần (cao -> thấp) — áp dụng cho
    // cả All lẫn từng nhóm vị trí, theo yêu cầu chuẩn hoá thứ tự hiển thị cho mọi bảng siêu thị.
    const rows = stores.map((s) => {
      const rev = storeRevForPeriod(s);
      const revPrev = storePrevRevForPeriod(s);
      const realFresh4 = byStoreMap ? byStoreMap[String(s.id)] : null;
      let fresh, freshPrev, cats;
      if (realFresh4) {
        fresh = realFresh4.reduce((sum, f) => sum + f.hist[curIdx], 0);
        freshPrev = realFresh4.reduce((sum, f) => sum + f.hist[prevIdx], 0);
        cats = realFresh4.map((f) => ({ name: f.name, g: f.g, deltaTrieu: (f.hist[curIdx] - f.hist[prevIdx]) * 1000 }));
      } else {
        fresh = rev * DATA.cat3.fresh;
        freshPrev = revPrev * DATA.cat3.fresh;
        cats = fresh4.map((f) => {
          const g = s.growth === null ? f.g : s.growth + (f.g - avgG);
          // BUG cũ: nhân f.share (tỷ trọng trong 4 nhóm Fresh, cộng lại = 100%) thẳng vào TOÀN BỘ
          // doanh thu siêu thị (rev) thay vì vào doanh thu Fresh (fresh = rev * cat3.fresh) — khiến
          // cộng 4 nhóm lại ra đúng bằng cả doanh thu siêu thị (rev) thay vì đúng bằng Fresh dự kiến
          // (mục 7 người dùng báo "cộng lại chưa khớp"). Sửa: nhân f.share vào fresh/freshPrev.
          const cur = fresh * f.share;
          const prev = freshPrev * f.share;
          const deltaTrieu = (cur - prev) * 1000;
          return { name: f.name, g, deltaTrieu };
        });
      }
      return { s, fresh, freshPrev, cats };
    }).sort((a, b) => b.fresh - a.fresh);
    return `
    <div class="panel">
      <div class="panelhead"><div><h2>Fresh theo siêu thị</h2><p>Chọn All hoặc 1 trong 4 nhóm vị trí mặt bằng · kèm doanh thu tăng/giảm (triệu đồng) bên cạnh %, tô xanh ngành hiệu quả nhất và đỏ ngành yếu nhất trong 4 ngành Fresh của từng siêu thị. Số liệu THẬT theo từng siêu thị (nguồn: ${isWeek ? "DATA NH TUẦN" : "DATA NH THÁNG"}).</p></div></div>
      <div class="rofilters">
        <button class="${STATE.roFresh === "all" ? "on" : ""}" onclick="App.setRoFresh('all')">All</button>
        ${BASKET_LIST.map((b) => `<button class="${STATE.roFresh === b.key ? "on" : ""}" onclick="App.setRoFresh('${b.key}')">${b.icon} ${b.label}</button>`).join("")}
      </div>
      ${stores.length ? `<div class="tablewrap"><table>
        <thead><tr><th>Siêu thị</th><th>Fresh dự kiến</th>${fresh4.map((f) => `<th>${f.name}</th>`).join("")}</tr></thead>
        <tbody>${rows.map(({ s, fresh, freshPrev, cats }) => {
          const maxG = Math.max(...cats.map((c) => c.g));
          const minG = Math.min(...cats.map((c) => c.g));
          const cell = (c) => {
            const bg = c.g === maxG ? "background:var(--green-bg)" : c.g === minG ? "background:var(--danger-bg)" : "";
            return `<td style="${bg}"><span class="${dcls(c.deltaTrieu)}">${c.deltaTrieu >= 0 ? "+" : ""}${fmtInt(c.deltaTrieu)} triệu</span><div class="small ${dcls(c.g)}">${pct(c.g)}</div></td>`;
          };
          const pos = basketOf(s.vitri_key);
          // Bổ sung: dưới tổng Fresh dự kiến, hiện thêm % tăng trưởng và số tăng thêm (triệu đồng) so
          // với kỳ trước — cùng kiểu hiển thị với 4 cột ngành hàng Fresh bên cạnh, để nhất quán.
          const freshDeltaTrieu = (fresh - freshPrev) * 1000;
          const freshGrowthPct = freshPrev ? ((fresh - freshPrev) / freshPrev) * 100 : null;
          return `<tr><td><b>${s.id} · ${s.name}</b><div class="small">${pos ? pos.label : "—"}</div></td>
          <td><b>${fmtInt(fresh * 1000)} triệu</b><div class="small ${dcls(freshGrowthPct)}">${freshDeltaTrieu >= 0 ? "+" : ""}${fmtInt(freshDeltaTrieu)} triệu · ${pct(freshGrowthPct)}</div></td>
          ${cats.map(cell).join("")}</tr>`;
        }).join("")}</tbody>
      </table></div>` : `<div class="footnote">Không có siêu thị nào khớp bộ lọc hiện tại.</div>`}
    </div>`;
  }

  // ---------- page assembly ----------
  function renderMienTab() {
    const s = mienSeries();
    // Vòng 18: khi đã lọc theo Quận (mienQuanGroup() != null), toàn bộ khối "hero" (KPI/Diễn biến/Cơ
    // cấu 3 khối) đổi sang số CỘNG DỒN THẬT của đúng các siêu thị khớp Quận (và QLTP nếu có chọn kèm)
    // thay vì luôn hiện số TOÀN MIỀN như trước — đúng yêu cầu "chọn Quận thì số liệu bên dưới phải chạy".
    const qGroup = mienQuanGroup();
    return `
      ${kpiRowFor(s)}
      <div id="sec-quyetdinh">${elDecisionCenterMien()}</div>
      ${elTrendPanel("Diễn biến doanh thu · lượt bill · sản lượng Fresh", qGroup ? qGroup.name : "Miền Trung Đức",
        qGroup
          ? { rev: qGroup.rev_month_full, bill: qGroup.bill_month_full, fresh: qGroup.fresh_month_full,
              note: `Số liệu THẬT cộng dồn từ đúng các siêu thị khớp bộ lọc đang chọn (${qGroup.name}), không phải số toàn Miền.` }
          : { rev: DATA.mien_rev_month_full || DATA.mien_rev_month, bill: DATA.mien_bill_month_full || DATA.mien_bill_month, fresh: DATA.mien_fresh_month_full || DATA.mien_fresh_month,
              note: "Doanh thu · Bill ở đây là TỔNG TOÀN MIỀN (tất cả siêu thị, kể cả nhóm đang chờ gán QLTP) nên có thể chênh nhẹ so với số ở các mục theo dõi Target/QLTP bên dưới (chỉ cộng 11 QLTP đã đặt Target). Sản lượng Fresh cộng theo 11 QLTP đã đặt Target (chưa gồm nhóm chờ gán QLTP)." },
        qGroup ? { rev: qGroup.rev_week, bill: qGroup.bill_week, fresh: qGroup.fresh_week } : { rev: DATA.mien_rev_week, bill: mienWeeklyBill(), fresh: mienWeeklyFresh() })}
      <div id="sec-nganh">
      ${elCoCau3Khoi(s, qGroup ? `Ba kỳ liên kế · số liệu riêng ${qGroup.name}` : "Ba kỳ liên kế và tăng trưởng doanh thu so với cùng kỳ")}
      ${elTop5(qGroup ? "quận đang chọn" : "khu vực")}
      ${elFreshNganh(s, qGroup ? "trong quận" : "toàn miền")}
      </div>
      <div id="sec-qltp">
      ${elHieuQuaQLTP()}
      ${elFreshTheoQLTP()}
      ${elBasketOverview()}
      ${elBasketDetail()}
      </div>
      ${elDiemNghen()}
      <div class="footnote">Số liệu thật, trích xuất & đối chiếu từ file BC DTHU THU THÁNG.xlsx (nguồn OneDrive BC DOANH THU) — cập nhật đến ${DATA.meta.ngay_cap_nhat || "—"}. Bộ lọc QLTP/Siêu thị/Ngành hàng/Nhóm hàng ở trên áp dụng cho toàn bộ các phần bên dưới.</div>
    `;
  }

  function elKpiRowQltp(q) { return kpiRowFor(qltpSeries(q)); }

  function renderQltpTabFull() {
    const q = qltpByCode(effectiveQltpCode());
    // Khi đang lọc đúng 1 Siêu thị cụ thể, toàn bộ phần "hero" phía trên (kịch bản tăng trưởng, KPI,
    // diễn biến, cơ cấu 3 khối) phải đổi theo ĐÚNG siêu thị đó thay vì vẫn hiện số của cả QLTP như
    // trước đây (lỗi mục 1 & 2 người dùng báo) — chỉ bảng Trung tâm quyết định / Hiệu quả siêu thị /
    // Fresh theo siêu thị bên dưới vẫn luôn dùng q.code thật vì các bảng đó tự lọc theo Siêu thị rồi.
    const selStore = STATE.store !== "all" ? DATA.stores.find((s2) => String(s2.id) === String(STATE.store)) : null;
    // Vòng 18: khi KHÔNG chọn 1 siêu thị cụ thể nhưng CÓ lọc Quận, gộp đúng các siêu thị của QLTP đang
    // xem nằm trong quận đó (storesGroupAsQltpLike) — trước đây trường hợp này vẫn hiện nguyên số của cả
    // QLTP (biến `q`), bỏ qua hoàn toàn bộ lọc Quận cho toàn bộ khối hero phía trên.
    const quanStores = !selStore && STATE.quan !== "all" ? scopedStores(q.code) : null;
    const scopeObj = selStore
      ? storeAsQltpLike(selStore)
      : quanStores
        ? storesGroupAsQltpLike(quanStores, `${q.code}|${STATE.quan}`, `${q.name} · Quận ${STATE.quan}`, `QLTP ${q.name} · Quận ${STATE.quan}`)
        : q;
    const s = qltpSeries(scopeObj);
    const scopeWord = selStore ? "siêu thị" : quanStores ? "quận đang chọn" : "khu vực";
    return `
      ${elScenarioPanel(scopeObj)}
      ${elKpiRowQltp(scopeObj)}
      <div id="sec-qltp2-quyetdinh">${elDecisionQltp(q)}</div>
      ${elTrendPanel("Diễn biến doanh thu · lượt bill · sản lượng Fresh", selStore ? `Siêu thị ${selStore.id} · ${selStore.name}` : (quanStores ? scopeObj.name : `Khu vực ${q.name}`),
        { rev: scopeObj.rev_month_full || scopeObj.rev_month,
          bill: scopeObj.bill_month_full || scopeObj.bill_month,
          fresh: scopeObj.fresh_month_full || scopeObj.fresh_month,
          note: selStore
            ? (STATE.period === "week"
              ? "Doanh thu · Bill · Sản lượng Fresh theo tuần ở đây đều là số THẬT ghi nhận theo từng siêu thị (nguồn: DATA DTHU TUẦN / DATA NH TUẦN), không còn suy diễn."
              : "Doanh thu · Bill · Sản lượng Fresh theo tháng ở đây đều là số THẬT ghi nhận theo từng siêu thị (nguồn: DATA DTHU THÁNG / 03b_Fresh_ST_Thang), không còn suy diễn.")
            : (quanStores ? `Số liệu THẬT cộng dồn từ đúng ${quanStores.length} siêu thị khớp QLTP ${q.name} + Quận ${STATE.quan}.` : undefined) },
        { rev: scopeObj.rev_week, bill: scopeObj.bill_week, fresh: scopeObj.fresh_week })}
      <div id="sec-qltp2-nganh">
      ${elCoCau3Khoi(s, selStore ? `Siêu thị ${selStore.name}` : (quanStores ? `Số liệu riêng ${scopeObj.name}` : `Giữ nguyên cấu trúc bảng Miền · số liệu riêng QLTP ${q.name}`))}
      ${elTop5(scopeWord)}
      ${elFreshNganh(s, selStore ? "trong siêu thị" : (quanStores ? "trong quận" : "trong khu vực"))}
      </div>
      ${elStoreTable(q)}
      ${elFreshStoreTable(q)}
      <div class="footnote">Danh sách siêu thị lấy theo dữ liệu thật từ file BC DTHU THU THÁNG.xlsx.</div>
    `;
  }

  function renderSidebar() {
    const items = [
      { icon: "▦", label: "Tổng quan miền", target: STATE.tab === "mien" ? "sec-quyetdinh" : "sec-qltp2-quyetdinh" },
      { icon: "◫", label: "Ngành & nhóm hàng", target: STATE.tab === "mien" ? "sec-nganh" : "sec-qltp2-nganh" },
      { icon: "◎", label: "QLTP & rổ shop", target: STATE.tab === "mien" ? "sec-qltp" : "sec-qltp-shop" },
      { icon: "⚑", label: "Điểm nghẽn", target: "sec-diemnghen" },
    ];
    return `
    <div class="brand">
      <div class="logo">B</div>
      <div><div class="name">BHX Analytics</div><div class="sub">ĐIỀU HÀNH MIỀN</div></div>
    </div>
    ${items.map((it) => `<button class="navitem" onclick="App.scrollTo('${it.target}')"><span>${it.icon}</span> ${it.label}</button>`).join("")}
    <div class="illus-box"><b>NGUỒN DỮ LIỆU</b><br/>BC DTHU THU THÁNG.xlsx · OneDrive BC DOANH THU · cập nhật đến ${DATA.meta.ngay_cap_nhat || "—"}.</div>
    `;
  }

  function render() {
    const app = document.getElementById("app");
    app.innerHTML = `
    <div class="layout">
      <div class="sidebar">${renderSidebar()}</div>
      <div class="main">
        ${elHeader()}
        ${elTabsAndFilters()}
        ${STATE.tab === "mien" ? renderMienTab() : renderQltpTabFull()}
      </div>
    </div>`;
  }

  window.App = {
    setTab(t) {
      STATE.tab = t;
      if (t === "qltp" && STATE.qltp === "all") STATE.qltp = DEFAULT_QLTP;
      render();
    },
    setPeriod(p) { STATE.period = p; render(); },
    setQltpFilter(code) { STATE.qltp = code; STATE.store = "all"; render(); },
    setQuan(q) { STATE.quan = q; STATE.store = "all"; render(); },
    setStoreFilter(id) { STATE.store = id; render(); },
    setBasket(k) { STATE.basket = k; render(); },
    setRo(r) { STATE.ro = r; render(); },
    setRoFresh(r) { STATE.roFresh = r; render(); },
    scrollTo(id) {
      if (id.indexOf("sec-qltp2") === 0) {
        STATE.tab = "qltp";
        if (STATE.qltp === "all") STATE.qltp = DEFAULT_QLTP;
      }
      render();
      requestAnimationFrame(() => {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    },
  };

  render();
})();

</script>
